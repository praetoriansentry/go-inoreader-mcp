# Runs the MCP server over streamable HTTP on http://127.0.0.1:8765/mcp
# with a bearer token. For stdio use (Claude Desktop / Claude Code) you do
# not need compose; see README.md.
services:
  inoreader-mcp:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ghcr.io/praetoriansentry/go-inoreader-mcp:${VERSION:-latest}
    env_file: .env
    environment:
      # Inside the container we must bind all interfaces for the port
      # mapping to work, so INOREADER_MCP_HTTP_TOKEN is mandatory here.
      INOREADER_MCP_HTTP_ADDR: 0.0.0.0:8765
      INOREADER_TOKEN_FILE: /data/tokens.json
    command: ["serve"]
    ports:
      # Published on loopback only; put a TLS proxy in front to expose it.
      - "127.0.0.1:8765:8765"
    volumes:
      - inoreader-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      # distroless has no shell or curl; the server exposes /healthz for
      # external checks (e.g. a reverse proxy), so we only check the process.
      disable: true

volumes:
  inoreader-data:
